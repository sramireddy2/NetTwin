[project]
name = "nettwin"
version = "0.1.0"
description = "Agentic network troubleshooter that works inside a containerlab + FRRouting digital twin"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "nettwin-core",
  "twinlab",
  "netverify",
  "netbench",
  "typer>=0.15",
  "httpx>=0.27",
]

[project.scripts]
nettwin = "nettwin.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
nettwin-core = { workspace = true }
twinlab = { workspace = true }
netverify = { workspace = true }
netbench = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nettwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "lab: needs the live containerlab lab inside WSL (set NETTWIN_LAB=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["nettwin", "nettwin_core", "twinlab", "netverify", "netbench"]
