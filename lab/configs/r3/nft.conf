# Golden packet filter on r3, the VLAN gateway.
# Rule order matters and is part of NetBench (ACL ordering scenarios).
table inet fw {
  chain input {
    type filter hook input priority filter; policy accept;
  }
  chain forward {
    type filter hook forward priority filter; policy accept;
    ip saddr 10.0.10.0/24 ip daddr 10.0.40.0/24 accept
    ip saddr 10.0.20.0/24 ip daddr 10.0.0.0/16 drop
  }
}
