frr defaults traditional
hostname r3
log stdout
service integrated-vtysh-config
!
interface lo
 ip ospf area 0.0.0.1
 ip ospf passive
!
interface eth1
 description to r1
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
!
interface eth2
 description to r2
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 3
!
interface eth3.10
 description VLAN 10 corporate
 ip ospf area 0.0.0.1
 ip ospf passive
!
interface eth3.20
 description VLAN 20 guest
 ip ospf area 0.0.0.1
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.3
 timers throttle spf 50 100 500
!
