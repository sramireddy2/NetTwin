# Golden NAT on r4: guests (VLAN 20) are masqueraded toward the ISP, corporate and server
# subnets are routed (advertised over eBGP) and never translated.
table ip nat {
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    oifname "eth3" ip saddr 10.0.20.0/24 masquerade
  }
}
