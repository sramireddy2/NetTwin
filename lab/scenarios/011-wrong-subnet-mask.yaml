id: 011-wrong-subnet-mask
title: Wrong prefix length on the server subnet gateway
tier: A
layer: L3
symptom: >
  NOC ticket: nobody can reach the file server (10.0.40.10), from inside or outside. The
  server itself is up and its gateway r2 pings from the core. Routing protocols report no
  errors.
inject:
  r2:
    - kind: set_addr
      iface: eth4
      address: 10.0.40.1/30
ground_truth:
  node: r2
  layer: L3
  component: ip.prefixlen
  summary: r2 eth4 is 10.0.40.1/30 instead of /24, so the server's address is outside the connected subnet
expected_fix:
  r2:
    - kind: set_addr
      iface: eth4
      address: 10.0.40.1/24
expected_failed_rules: [corp-to-srv, corp-to-srv-mtu, inet-to-srv]
probe: {node: h10, cmd: ping -c 1 -W 1 10.0.40.10, expect: fail}
