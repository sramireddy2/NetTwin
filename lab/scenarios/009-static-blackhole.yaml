id: 009-static-blackhole
title: Leftover static blackhole route on the edge router
tier: A
layer: L3
symptom: >
  NOC ticket: since a maintenance window the file server (10.0.40.10) is unreachable from
  the internet. Internal users reach it fine and the ISP still receives our prefix. OSPF
  and BGP are up everywhere.
inject:
  r4:
    - kind: frr_lines
      lines:
        - ip route 10.0.40.0/24 blackhole
ground_truth:
  node: r4
  layer: L3
  component: static.route
  summary: a static blackhole for 10.0.40.0/24 on r4 beats the OSPF route, so inbound traffic to the server is dropped
expected_fix:
  r4:
    - kind: frr_lines
      lines:
        - no ip route 10.0.40.0/24 blackhole
expected_failed_rules: [inet-to-srv]
probe: {node: inet, cmd: ping -c 1 -W 1 10.0.40.10, expect: fail}
