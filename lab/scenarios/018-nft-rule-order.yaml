id: 018-nft-rule-order
title: Broad drop rule inserted above the corporate accept on the VLAN gateway
tier: C
layer: policy
symptom: >
  NOC ticket: corporate users on VLAN 10 can no longer reach the file server 10.0.40.10,
  though they still reach the internet. A security change on the VLAN gateway "to keep
  guests off the file server" went in an hour ago. Routing looks normal on every router.
inject:
  r3:
    - kind: nft_rule
      action: insert
      table: fw
      chain: forward
      rule: ip daddr 10.0.40.0/24 drop
ground_truth:
  node: r3
  layer: policy
  component: nft.rule_order
  summary: a drop for all traffic to 10.0.40.0/24 was inserted at the top of r3's forward chain, above the rule that accepts corporate traffic to the server
expected_fix:
  r3:
    - kind: nft_rule
      action: delete
      table: fw
      chain: forward
      rule: ip daddr 10.0.40.0/24 drop
expected_failed_rules: [corp-to-srv, corp-to-srv-mtu]
probe: {node: h10, cmd: ping -c 1 -W 1 10.0.40.10, expect: fail}
