[project]
name = "twinlab"
version = "0.1.0"
description = "NetTwin twin-control MCP server: owns the digital twin and every mutation of it"
requires-python = ">=3.12"
dependencies = [
  "nettwin-core",
  "mcp>=1.12",
  "uvicorn>=0.30",
]

[project.scripts]
twinlab-server = "twinlab.server:main"

[tool.uv.sources]
nettwin-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinlab"]
