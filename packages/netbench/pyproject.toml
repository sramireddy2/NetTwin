[project]
name = "netbench"
version = "0.1.0"
description = "NetBench: fault-scenario harness, scoring and reports for NetTwin"
requires-python = ">=3.12"
dependencies = [
  "nettwin-core",
  "mcp>=1.12",
  "httpx>=0.27",
  "typer>=0.15",
]

[project.scripts]
netbench = "netbench.cli:main"

[tool.uv.sources]
nettwin-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netbench"]
