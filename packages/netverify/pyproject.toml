[project]
name = "netverify"
version = "0.1.0"
description = "NetTwin verification MCP server: reachability, route diff, intent checks, attestation"
requires-python = ">=3.12"
dependencies = [
  "nettwin-core",
  "mcp>=1.12",
  "uvicorn>=0.30",
]

[project.scripts]
netverify-server = "netverify.server:main"

[tool.uv.sources]
nettwin-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netverify"]
