[project]
name = "nettwin-core"
version = "0.1.0"
description = "Shared NetTwin contracts: typed ops, models, scenario and policy schemas, executor protocol"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nettwin_core"]
